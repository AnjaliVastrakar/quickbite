# =========================
# DATASOURCE
# =========================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.OracleLegacyDialect
spring.jpa.open-in-view=false

server.port=${PORT:8010}

# =========================
# JWT
# =========================

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================
# ACTUATOR
# =========================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

info.app.name=QuickBite
info.app.version=0.0.1-SNAPSHOT

# =========================
# OPENAPI / SWAGGER
# =========================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# =========================
# LOGGING
# =========================

logging.level.com.quickbite=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# =========================
# CORS
# =========================

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}